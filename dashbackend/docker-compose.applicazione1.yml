# Compose autosufficiente per applicazione1: include il suo database e la sua rete,
# così questo file da solo basta per deployare/aggiornare/riavviare applicazione1
# su un VPS senza toccare le altre applicazioni (che possono anche stare su un altro
# host). Config esterna in applicazione1/.env (mai copiata nell'immagine).
#
# Uso sul VPS:
#   cp applicazione1/.env.example applicazione1/.env   # solo la prima volta, poi modifica i valori
#   docker compose -f docker-compose.applicazione1.yml up -d --build

services:
  postgres-app1:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_APP1_DB:-linlodash}
      POSTGRES_USER: ${POSTGRES_APP1_USER:-app1}
      POSTGRES_PASSWORD: ${POSTGRES_APP1_PASSWORD:-app1-change-me}
    volumes: ["pgdata-app1:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP1_USER:-app1} -d ${POSTGRES_APP1_DB:-app1}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [app1-net]
    # Nessuna porta esposta all'host: il database è raggiungibile solo dal servizio applicazione1.
    # Per debug locale, scommenta: ports: ["5431:5432"]

  applicazione1:
    build:
      context: .
      dockerfile: applicazione1/Dockerfile
    env_file: applicazione1/.env
    environment:
      MESSAGES_BASENAME: ${MESSAGES_BASENAME:-file:/app/config/messages}
    volumes:
      - ./config:/app/config:ro
    ports: ["8081:8081"]
    depends_on:
      postgres-app1:
        condition: service_healthy
    restart: unless-stopped
    networks: [app1-net]

networks:
  app1-net:

volumes:
  pgdata-app1:
