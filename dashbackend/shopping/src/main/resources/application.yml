spring:
  application:
    name: shopping
  config:
    import: classpath:core-defaults.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://pg-linlodash:5432/linlodash}
    username: ${DB_USER:administrator}
    password: ${DB_PASSWORD:mela-change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 'validate' verifica che le tue entità Java corrispondano alle tabelle create dal client esterno.
      # Se preferisci che Spring crei le tabelle mancanti senza cancellare i dati, usa 'update'.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    table: flyway_schema_history_shopping
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration/core,classpath:db/migration/shopping
    default-schema: shopping
    schemas: public,${DB_SCHEMA:shopping}
    # Le installazioni esistenti vengono adottate alla versione corrente.
    # Un database vuoto esegue invece tutte le migrazioni dalla V1.
    baseline-on-migrate: true
    baseline-version: 2
app:
  cors:
    allowed-origins:
      - "http://localhost:4200"
server:
  port: 8082
