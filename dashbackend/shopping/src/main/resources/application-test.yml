spring:
  application:
    name: shopping
  config:
    import: classpath:core-defaults.yml
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        default_schema: PUBLIC
    hibernate:
      ddl-auto: none
    show-sql: true # Opzionale: mostra le query SQL nei log durante i test
app:
  flyway:
    core:
      enabled: true
      schema: public
      location-folder: core-h2
    shopping:
      schema: shopping
      location-folder: shopping-h2
  cors:
    allowed-origins:
      - "http://localhost:4200"
server:
  port: 8081
